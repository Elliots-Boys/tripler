    <script>
        // Scrolling marquee script
        function getScrolling() {
            var monthNames = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
            var theDate = new Date();
            var theDay = theDate.getDate();
            var theMonth = theDate.getMonth();
            var theYear = theDate.getFullYear();
            var theHour = theDate.getHours();
            var presenterName = "Overnight / Off Air";

            if (theHour >= 0 && theHour < 6) presenterName = "The Overnight Express";
            if (theHour >= 6 && theHour < 10) presenterName = "Breakfast with Stuart Clarkson";
            if (theHour >= 10 && theHour < 14) presenterName = "Mid Mornings with Nick Bewes";
            if (theHour >= 14 && theHour < 19) presenterName = "Afternoon Drive with Alex Cann";
            if (theHour >= 19) presenterName = "Evenings with Nick Babb";

            var fullDateStr = theDay + " " + monthNames[theMonth] + " " + theYear;
            var scrollMessage = "Welcome to TripleR | Date: " + fullDateStr + " | Now playing: " + presenterName;

            var marquee = document.getElementsByTagName("marquee")[0];
            if (marquee) {
                marquee.innerHTML = scrollMessage;
            }
        }
        window.onload = function() {
            getScrolling();
        };
    </script>
